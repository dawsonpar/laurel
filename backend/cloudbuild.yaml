steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - $_REGION-docker.pkg.dev/$PROJECT_ID/laurel/laurel-backend:$BUILD_ID
      - -t
      - $_REGION-docker.pkg.dev/$PROJECT_ID/laurel/laurel-backend:latest
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - $_REGION-docker.pkg.dev/$PROJECT_ID/laurel/laurel-backend
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - laurel-backend
      - --image=$_REGION-docker.pkg.dev/$PROJECT_ID/laurel/laurel-backend:$BUILD_ID
      - --region=$_REGION
      - --platform=managed
      - --allow-unauthenticated
      - --service-account=laurel-backend@$PROJECT_ID.iam.gserviceaccount.com
      - --set-env-vars=ENVIRONMENT=production,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=$_REGION,MOMENTS_BUCKET=$_MOMENTS_BUCKET,CORS_ALLOWED_ORIGINS=$_CORS_ALLOWED_ORIGINS

options:
  logging: GCS_ONLY

substitutions:
  _REGION: us-central1
  _MOMENTS_BUCKET: laurel-495915-moments
  _CORS_ALLOWED_ORIGINS: https://laurel.vercel.app
