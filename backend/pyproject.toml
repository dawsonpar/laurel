[project]
name = "laurel-backend"
version = "0.1.0"
description = "Laurel backend: Olympic and Paralympic moment explainer powered by Gemini."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.1",
    "google-cloud-firestore>=2.27.0",
    "google-cloud-storage>=3.10.1",
    "google-genai>=1.73.1",
    "nanoid>=2.0.0",
    "numpy>=2.4.4",
    "pydantic-settings>=2.14.0",
    "python-multipart>=0.0.27",
    "uvicorn[standard]>=0.46.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Prompt content mirrors natural-language rules; line breaks would mangle
# the prompt sent to Gemini.
"app/ai/prompts.py" = ["E501"]

